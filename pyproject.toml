[project]
name = "oci-ip-hunter"
version = "1.0.0"
description = "Oracle Cloud Infrastructure (OCI) IP 自动化猎取优选、直连测速与资源治理工具箱"
requires-python = ">=3.10"
dependencies = [
    "oci==2.189.0",
    "requests>=2.32,<3",
    "cryptography>=44,<51",
    "PyJWT>=2.10,<3",
    "playwright>=1.64.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
