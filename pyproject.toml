[project]
name = "oracle-cloud"
version = "1.0.0"
description = "Oracle Cloud Infrastructure (OCI) 统一 SDK 客户端与 IP 体检工具"
requires-python = ">=3.10"
dependencies = [
    "oci==2.189.0",
    "requests>=2.32,<3",
    "cryptography>=44,<51",
    "PyJWT>=2.10,<3",
    "playwright>=1.64.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
